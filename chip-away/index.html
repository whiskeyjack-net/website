    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in
         main.tsx) -- no Google Fonts CDN, so it loads instantly and offline. -->
    <!-- Pre-paint the theme so the correct background is up on the FIRST frame,
         with no light->dark recolor while the DB (and the Layout effect that
         reads it) resolve. Reads the theme the Layout mirrors to localStorage on
         this device; a fresh install (no mirror) falls back to the OS setting,
         which matches the app's default 'system' theme. The Layout re-applies
         the same classes idempotently once settings load.
         The hexes below run before any stylesheet, so they are the one place
         that cannot read the tokens -- keep them equal to the DS
         --color-background-light / -dark (and the .extra-dark black). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('chipAwayTheme'); // 'light' | 'dark' | 'oled'
          var dark = t ? (t === 'dark' || t === 'oled')
                       : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var oled = t === 'oled';
          var el = document.documentElement;
          if (dark) el.classList.add('dark');
          if (oled) el.classList.add('extra-dark');
          var color = dark ? (oled ? '#000000' : '#1d1d1d') : '#f2f0ed';
          // Paint the root directly. The classes above are inert until the
          // stylesheet loads (that is the whole gap this script exists to
          // cover), and the background lives on a `body` rule inside it -- so
          // without this the canvas stays the browser/webview default white
          // until the CSS lands. useTheme sets the same property on every
          // apply, so a later theme change keeps it in sync.
          // NOT on Tauri Linux: that window is undecorated + transparent with
          // CSS-only rounded corners, and the root's background propagates to
          // the CANVAS -- painting it fills the corners with opaque color and
          // squares the window off. Android's UA also says "Linux", hence the
          // second test. useTheme re-checks this properly (paintRoot) and
          // clears the property if this ran too early to know.
          var ua = navigator.userAgent;
          var linuxTauri = '__TAURI_INTERNALS__' in window &&
            ua.indexOf('Linux') !== -1 && !/android/i.test(ua);
          if (!linuxTauri) el.style.backgroundColor = color;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', color);
        } catch (e) {}
      })();
    </script>
